<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;border:1px solid #cbd5e1;border-radius:8px;">
  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="50" fill="#1B365D"/>
  <text x="400" y="32" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Texas Wesleyan University | DIT 7312 Enterprise Cybersecurity Governance</text>
  <rect x="0" y="50" width="800" height="4" fill="#D9A74A"/>
  
  <!-- NIST CSF 2.0 Core Functions -->
  <g transform="translate(40, 80)">
    <!-- GOVERN -->
    <rect x="0" y="0" width="720" height="50" rx="6" fill="#1B365D"/>
    <text x="360" y="31" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="14" font-weight="bold">GOVERN (GV) — Enterprise Risk Strategy, Roles, Supply Chain &amp; Oversight</text>
    
    <!-- 5 Operational Functions -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="135" height="120" rx="6" fill="#0284c7"/>
      <text x="67" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">IDENTIFY</text>
      <text x="67" y="55" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="11">Asset Mgmt</text>
      <text x="67" y="75" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="11">Risk Assessment</text>
      <text x="67" y="95" text-anchor="middle" fill="#e0f2fe" font-family="Arial" font-size="11">C-SCRM (Supply)</text>

      <rect x="146" y="0" width="135" height="120" rx="6" fill="#16a34a"/>
      <text x="213" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">PROTECT</text>
      <text x="213" y="55" text-anchor="middle" fill="#dcfce7" font-family="Arial" font-size="11">Zero Trust Identity</text>
      <text x="213" y="75" text-anchor="middle" fill="#dcfce7" font-family="Arial" font-size="11">Data Protection</text>
      <text x="213" y="95" text-anchor="middle" fill="#dcfce7" font-family="Arial" font-size="11">Platform Security</text>

      <rect x="292" y="0" width="135" height="120" rx="6" fill="#d97706"/>
      <text x="359" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">DETECT</text>
      <text x="359" y="55" text-anchor="middle" fill="#fef3c7" font-family="Arial" font-size="11">Continuous Telemetry</text>
      <text x="359" y="75" text-anchor="middle" fill="#fef3c7" font-family="Arial" font-size="11">MITRE ATT&amp;CK</text>
      <text x="359" y="95" text-anchor="middle" fill="#fef3c7" font-family="Arial" font-size="11">Adverse Anomalies</text>

      <rect x="438" y="0" width="135" height="120" rx="6" fill="#dc2626"/>
      <text x="505" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">RESPOND</text>
      <text x="505" y="55" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="11">Incident Response</text>
      <text x="505" y="75" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="11">Mitigation &amp; Legal</text>
      <text x="505" y="95" text-anchor="middle" fill="#fee2e2" font-family="Arial" font-size="11">Crisis Escalation</text>

      <rect x="584" y="0" width="135" height="120" rx="6" fill="#7c3aed"/>
      <text x="651" y="30" text-anchor="middle" fill="#ffffff" font-family="Arial" font-size="13" font-weight="bold">RECOVER</text>
      <text x="651" y="55" text-anchor="middle" fill="#ede9fe" font-family="Arial" font-size="11">Resilience Restore</text>
      <text x="651" y="75" text-anchor="middle" fill="#ede9fe" font-family="Arial" font-size="11">Immutable Backups</text>
      <text x="651" y="95" text-anchor="middle" fill="#ede9fe" font-family="Arial" font-size="11">Post-Event Review</text>
    </g>

    <!-- Regulatory Shield -->
    <rect x="0" y="210" width="720" height="50" rx="6" fill="#0f172a"/>
    <text x="360" y="241" text-anchor="middle" fill="#D9A74A" font-family="Arial" font-size="13" font-weight="bold">REGULATORY &amp; FIDUCIARY COMPLIANCE: SEC Disclosures | NIST SP 800-207 | SACSCOC Standard 9.1</text>
  </g>
</svg>