<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#F8FAFC" rx="12"/>
  <rect x="20" y="20" width="920" height="70" fill="#1B365D" rx="8"/>
  <text x="480" y="55" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">CSC-6365: Advanced Database Systems and Data Architectures</text>
  <text x="480" y="75" fill="#D9A74A" font-family="Arial, sans-serif" font-size="14" text-anchor="middle">Texas Wesleyan University — Master of Science in Computer Science (MCS)</text>

  <!-- Layer 1 -->
  <g transform="translate(60, 120)">
    <rect width="840" height="75" fill="#FFFFFF" stroke="#1B365D" stroke-width="2" rx="6"/>
    <text x="30" y="35" fill="#1B365D" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Application Query Interface</text>
    <text x="30" y="58" fill="#475569" font-family="Arial, sans-serif" font-size="13">SQL / GraphQL / Analytical Ingestion</text>
    <circle cx="800" cy="37" r="14" fill="#D9A74A"/>
    <text x="800" y="42" fill="#1B365D" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">L1</text>
  </g>

  <!-- Layer 2 -->
  <g transform="translate(60, 215)">
    <rect width="840" height="75" fill="#FFFFFF" stroke="#1B365D" stroke-width="2" rx="6"/>
    <text x="30" y="35" fill="#1B365D" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Query Optimization Engine</text>
    <text x="30" y="58" fill="#475569" font-family="Arial, sans-serif" font-size="13">Cost-Based Optimizer / Plan Tree / MVCC</text>
    <circle cx="800" cy="37" r="14" fill="#D9A74A"/>
    <text x="800" y="42" fill="#1B365D" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">L2</text>
  </g>

  <!-- Layer 3 -->
  <g transform="translate(60, 310)">
    <rect width="840" height="75" fill="#FFFFFF" stroke="#1B365D" stroke-width="2" rx="6"/>
    <text x="30" y="35" fill="#1B365D" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Storage & Engine Internals</text>
    <text x="30" y="58" fill="#475569" font-family="Arial, sans-serif" font-size="13">B+ Tree / LSM-Tree / Buffer Pool</text>
    <circle cx="800" cy="37" r="14" fill="#D9A74A"/>
    <text x="800" y="42" fill="#1B365D" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">L3</text>
  </g>

  <!-- Layer 4 -->
  <g transform="translate(60, 405)">
    <rect width="840" height="75" fill="#FFFFFF" stroke="#1B365D" stroke-width="2" rx="6"/>
    <text x="30" y="35" fill="#1B365D" font-family="Arial, sans-serif" font-size="16" font-weight="bold">Distributed Lakehouse Tier</text>
    <text x="30" y="58" fill="#475569" font-family="Arial, sans-serif" font-size="13">Parquet / Delta Lake / Distributed Sharding</text>
    <circle cx="800" cy="37" r="14" fill="#D9A74A"/>
    <text x="800" y="42" fill="#1B365D" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">L4</text>
  </g>

  <text x="480" y="515" fill="#64748B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Texas Wesleyan University Computing Infrastructure Standard — Course Code CSC-6365</text>
</svg>